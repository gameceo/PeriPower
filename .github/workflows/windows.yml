name: Windows build and protocol tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test Stream Deck plugin
        working-directory: integrations/streamdeck
        shell: pwsh
        run: |
          npm ci
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run validate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run pack
          exit $LASTEXITCODE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtwebsockets -O C:/Qt
          exit $LASTEXITCODE
      - name: Configure, build and deploy
        shell: pwsh
        run: |
          ./scripts/fetch-headsetcontrol.ps1
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH=C:/Qt/6.8.3/msvc2022_64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "C:/Qt/6.8.3/msvc2022_64/bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build --config Release --prefix "$PWD/dist"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: PeriPower-Windows
          path: |
            dist/
            integrations/streamdeck/*.streamDeckPlugin
